<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="850" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2933">
    MSSQL OpenAPI Actions Architecture - Read-Only Connector
  </text>

  <!-- Client Section -->
  <g id="clients">
    <rect x="40" y="100" width="240" height="260" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="160" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">
      ACTIONS CONSUMERS
    </text>
    <rect x="60" y="150" width="200" height="60" rx="6" fill="#3b82f6"/>
    <text x="160" y="180" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">OpenAI Actions Platform</text>
    <rect x="60" y="220" width="200" height="60" rx="6" fill="#3b82f6"/>
    <text x="160" y="250" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">Internal MCP Clients</text>
    <rect x="60" y="290" width="200" height="60" rx="6" fill="#3b82f6"/>
  <text x="160" y="320" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">Automation &amp; Dashboards</text>
  </g>

  <!-- Public Internet -->
  <g id="internet">
    <rect x="320" y="190" width="170" height="100" rx="12" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <text x="405" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">PUBLIC INTERNET</text>
    <text x="405" y="245" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">HTTPS 443 / JSON</text>
    <text x="405" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fde68a">TLS + Bearer Header</text>
  </g>

  <!-- Cloud Boundary -->
  <g id="cloud">
    <rect x="520" y="70" width="640" height="360" rx="16" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="840" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#b45309">
      SECURE HOSTING ZONE (NGINX + Containers)
    </text>

    <!-- NGINX Block -->
    <rect x="550" y="130" width="280" height="120" rx="10" fill="#111827" stroke="#0f172a" stroke-width="2"/>
    <text x="690" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">NGINX REVERSE PROXY</text>
  <text x="690" y="185" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#d1d5db">TLS Termination &amp; CORS</text>
  <text x="690" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9ca3af">Routes `/actions/*` → port 8009</text>
    <text x="690" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#22d3ee">Pass-through Authorization header</text>

    <!-- FastAPI Service -->
    <rect x="870" y="130" width="260" height="160" rx="10" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <text x="1000" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">MCP OPENAPI SERVER</text>
    <text x="1000" y="185" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#dcfce7">FastAPI + Uvicorn (port 8009)</text>
    <text x="1000" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ecfdf5">Implements list/describe/sample/execute</text>
    <text x="1000" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#bbf7d0">Validates SELECT-only queries</text>
    <text x="1000" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#bef264">Publishes OpenAPI 3.1 schema</text>
    <text x="1000" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#bbf7d0">Requires static bearer token</text>
  </g>

  <!-- Database Layer -->
  <g id="database">
    <rect x="520" y="450" width="640" height="260" rx="16" fill="#1f2937" stroke="#111827" stroke-width="2"/>
    <text x="840" y="480" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">MICROSOFT SQL SERVER</text>
    <text x="840" y="505" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#9ca3af">Read-only credentials | ODBC Driver 18</text>
    <rect x="560" y="520" width="560" height="150" rx="10" fill="#374151"/>
    <text x="840" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e5e7eb">Database Capabilities</text>
    <text x="580" y="570" font-family="Arial, sans-serif" font-size="12" fill="#d1d5db">• INFORMATION_SCHEMA queries for metadata</text>
    <text x="580" y="590" font-family="Arial, sans-serif" font-size="12" fill="#d1d5db">• ApplicationIntent=ReadOnly enforced</text>
    <text x="580" y="610" font-family="Arial, sans-serif" font-size="12" fill="#d1d5db">• Result normalization (datetime → ISO, decimals → float)</text>
    <text x="580" y="630" font-family="Arial, sans-serif" font-size="12" fill="#d1d5db">• Row count best effort in `describe_table`</text>
  </g>

  <!-- Flow Arrows -->
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Clients to Internet -->
  <path d="M 280 230 L 320 230" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="300" y="365" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">HTTPS Requests</text>

  <!-- Internet to NGINX -->
  <path d="M 490 240 L 550 190" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="540" y="320" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">TLS Offload</text>

  <!-- NGINX to FastAPI -->
  <path d="M 830 190 L 870 190" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <text x="860" y="320" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">Proxied `/actions/*`</text>

  <!-- FastAPI to Database -->
  <path d="M 1000 290 L 1000 450" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow-slate)"/>
  <text x="1030" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e5e7eb">ODBC (Port 1433)</text>

  <!-- Security Badges -->
  <g id="security">
    <rect x="40" y="400" width="150" height="34" rx="17" fill="#f97316"/>
    <text x="115" y="422" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">TLS 1.2+</text>
    <rect x="200" y="400" width="170" height="34" rx="17" fill="#16a34a"/>
    <text x="285" y="422" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">Bearer Token Required</text>
    <rect x="380" y="400" width="190" height="34" rx="17" fill="#1f2937"/>
    <text x="475" y="422" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f9fafb">Read-Only SQL Enforcement</text>
  </g>

  <!-- Request Lifecycle -->
  <g id="lifecycle">
    <rect x="40" y="470" width="430" height="180" rx="12" fill="#ffffff" stroke="#cbd5f5" stroke-width="1.5"/>
    <text x="255" y="500" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">Typical Request Flow</text>
    <text x="60" y="530" font-family="Arial, sans-serif" font-size="12" fill="#334155">1. Client issues `GET /actions/list_tables` with bearer token</text>
    <text x="60" y="550" font-family="Arial, sans-serif" font-size="12" fill="#334155">2. NGINX validates TLS, forwards headers, enforces CORS</text>
    <text x="60" y="570" font-family="Arial, sans-serif" font-size="12" fill="#334155">3. FastAPI verifies token, runs query guard, executes SQL</text>
    <text x="60" y="590" font-family="Arial, sans-serif" font-size="12" fill="#334155">4. Results normalized to JSON (ISO timestamps, floats)</text>
    <text x="60" y="610" font-family="Arial, sans-serif" font-size="12" fill="#334155">5. Response returned to caller (CORS headers preserved)</text>
  </g>

  <!-- Endpoint Summary -->
  <g id="endpoints">
  <rect x="40" y="670" width="1120" height="180" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="600" y="700" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f766e">Published Endpoints</text>
  <text x="120" y="725" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f766e">• `/actions/health` (no auth)</text>
  <text x="120" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f766e">• `/actions/list_tables` (GET)</text>
  <text x="120" y="765" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f766e">• `/actions/describe_table?table_name=`</text>
  <text x="120" y="785" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f766e">• `/actions/get_table_sample?table_name=&amp;limit=`</text>
  <text x="120" y="805" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#0f766e">• `/actions/execute_sql` (POST)</text>
  <text x="600" y="825" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0f766e">All secured endpoints require `Authorization: Bearer &lt;token&gt;`</text>
  <text x="600" y="845" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0f766e">OpenAPI definition: `/actions/openapi.json` (served by FastAPI)</text>
  </g>
</svg>
