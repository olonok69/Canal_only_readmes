<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill:#ffffff; stroke:#1f2937; stroke-width:2; rx:8; ry:8; }
      .group { fill:#f3f4f6; stroke:#9ca3af; stroke-width:2; rx:10; ry:10; }
      .label { font-family:Segoe UI, Arial, sans-serif; font-size:16px; fill:#111827; }
      .small { font-size:14px; fill:#374151; }
      .title { font-size:18px; font-weight:bold; fill:#111827; }
      .arrow { stroke:#374151; stroke-width:2; marker-end:url(#arrowhead); fill:none; }
    ]]></style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
  </defs>

  <text class="title" x="40" y="40">Agentic Knowledge Graph - Architecture Overview</text>

  <rect class="group" x="40" y="70" width="620" height="780" />
  <text class="title" x="60" y="100">Application Package (agentic_kg_app)</text>

  <rect class="box" x="60" y="130" width="580" height="90" />
  <text class="label" x="80" y="160">cli.py</text>
  <text class="small" x="80" y="185">Entry point: ready | reset | ingest</text>

  <rect class="box" x="60" y="240" width="580" height="90" />
  <text class="label" x="80" y="270">orchestrator.py</text>
  <text class="small" x="80" y="295">Loads config, sets logging, creates Neo4j client, composes agents</text>

  <rect class="box" x="60" y="350" width="580" height="140" />
  <text class="label" x="80" y="380">agents/</text>
  <text class="small" x="100" y="405">data_ingest_agent.py - copy CSVs, constraints, LOAD CSV nodes/edges</text>
  <text class="small" x="100" y="430">graph_ops_agent.py - ready, clear graph, version checks</text>

  <rect class="box" x="60" y="510" width="580" height="90" />
  <text class="label" x="80" y="540">neo4j_client.py</text>
  <text class="small" x="80" y="565">Driver wrapper: session/run, result conversion, import dir</text>

  <rect class="box" x="60" y="620" width="580" height="90" />
  <text class="label" x="80" y="650">config.py</text>
  <text class="small" x="80" y="675">YAML + .env loader with validation</text>

  <rect class="box" x="60" y="730" width="580" height="90" />
  <text class="label" x="80" y="760">logging_setup.py, utils.py</text>
  <text class="small" x="80" y="785">Console + rotating file; helpers for SET clauses &amp; CSV copy</text>

  <rect class="group" x="700" y="70" width="660" height="780" />
  <text class="title" x="720" y="100">Runtime &amp; External</text>

  <rect class="box" x="720" y="130" width="620" height="140" />
  <text class="label" x="740" y="160">configs/app.yaml</text>
  <text class="small" x="740" y="185">nodes, relationships, logging, Neo4j connection</text>
  <text class="label" x="740" y="215">.env</text>
  <text class="small" x="740" y="240">NEO4J_URI / USERNAME / PASSWORD / DATABASE / IMPORT_DIR</text>

  <rect class="box" x="720" y="290" width="620" height="120" />
  <text class="label" x="740" y="320">data/*.csv</text>
  <text class="small" x="740" y="345">products, assemblies, parts, suppliers, part_supplier_mapping</text>

  <rect class="box" x="720" y="430" width="620" height="180" />
  <text class="label" x="740" y="460">Neo4j</text>
  <text class="small" x="740" y="485">Import directory (CSV destination)</text>
  <text class="small" x="740" y="510">LOAD CSV MERGE nodes / relationships</text>
  <text class="small" x="740" y="535">Graph model: Product → Assembly → Part → Supplier</text>

  <rect class="box" x="720" y="630" width="620" height="90" />
  <text class="label" x="740" y="660">Logging</text>
  <text class="small" x="740" y="685">Console + logs/app.log (rotating)</text>

  <!-- arrows -->
  <path class="arrow" d="M 350 175 L 700 175" />
  <path class="arrow" d="M 350 285 L 700 215" />
  <path class="arrow" d="M 350 585 L 700 485" />
  <path class="arrow" d="M 350 755 L 700 665" />
  <path class="arrow" d="M 1030 350 L 1030 430" />
</svg>
