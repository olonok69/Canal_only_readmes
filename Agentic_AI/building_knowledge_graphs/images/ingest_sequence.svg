<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style type="text/css"><![CDATA[
      .lane { fill:#f3f4f6; stroke:#9ca3af; stroke-width:1; }
      .label { font-family:Segoe UI, Arial, sans-serif; font-size:16px; fill:#111827; }
      .small { font-size:14px; fill:#374151; }
      .title { font-size:18px; font-weight:bold; fill:#111827; }
      .arrow { stroke:#374151; stroke-width:2; marker-end:url(#arrowhead); fill:none; }
      .box { fill:#ffffff; stroke:#1f2937; stroke-width:1; rx:6; ry:6; }
    ]]></style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
  </defs>

  <text class="title" x="40" y="40">Ingest Sequence (ingest command)</text>

  <!-- lanes -->
  <rect class="lane" x="40" y="70" width="320" height="780" />
  <text class="label" x="60" y="100">CLI</text>

  <rect class="lane" x="380" y="70" width="320" height="780" />
  <text class="label" x="400" y="100">Orchestrator</text>

  <rect class="lane" x="720" y="70" width="320" height="780" />
  <text class="label" x="740" y="100">DataIngestAgent</text>

  <rect class="lane" x="1060" y="70" width="300" height="780" />
  <text class="label" x="1080" y="100">Neo4j</text>

  <!-- steps -->
  <rect class="box" x="60" y="140" width="280" height="60" />
  <text class="small" x="75" y="175">python -m agentic_kg_app.cli ingest --config ...</text>
  <path class="arrow" d="M 340 170 L 380 170" />

  <rect class="box" x="400" y="200" width="280" height="60" />
  <text class="small" x="415" y="235">Load YAML &amp; merge .env</text>

  <rect class="box" x="400" y="280" width="280" height="60" />
  <text class="small" x="415" y="315">Setup logging, create Neo4j client</text>
  <path class="arrow" d="M 680 310 L 720 310" />

  <rect class="box" x="740" y="360" width="280" height="60" />
  <text class="small" x="755" y="395">Copy CSVs → Neo4j import dir</text>
  <path class="arrow" d="M 1020 390 L 1060 390" />

  <rect class="box" x="740" y="440" width="280" height="60" />
  <text class="small" x="755" y="475">Create uniqueness constraints</text>

  <rect class="box" x="740" y="520" width="280" height="60" />
  <text class="small" x="755" y="555">LOAD CSV MERGE nodes</text>

  <rect class="box" x="740" y="600" width="280" height="60" />
  <text class="small" x="755" y="635">LOAD CSV MERGE relationships</text>

  <rect class="box" x="740" y="700" width="280" height="60" />
  <text class="small" x="755" y="735">Return success or error</text>

  <!-- arrows sequence -->
  <path class="arrow" d="M 520 260 L 520 280" />
  <path class="arrow" d="M 680 310 L 680 390" />
  <path class="arrow" d="M 900 390 L 900 460" />
  <path class="arrow" d="M 900 460 L 900 540" />
  <path class="arrow" d="M 900 540 L 900 620" />
  <path class="arrow" d="M 900 620 L 900 730" />

</svg>
