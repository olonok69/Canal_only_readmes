<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Arial, sans-serif">
  <style>
    .box { fill:#0f172a; stroke:#7dd3fc; stroke-width:2; rx:10; ry:10; }
    .cloud { fill:#111827; stroke:#c084fc; stroke-width:2; rx:14; ry:14; }
    .text { fill:#e5e7eb; font-size:14px; }
    .title { fill:#e5e7eb; font-size:20px; font-weight:bold; }
    .arrow { stroke:#9ca3af; stroke-width:2; marker-end:url(#arrowhead); }
    .label { fill:#9ca3af; font-size:13px; }
    .label-red { fill:#f87171; font-size:13px; font-weight:bold; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" class="title">Direct Line + Graph Retrieval Architecture</text>

  <!-- User / Browser -->
  <rect x="60" y="100" width="240" height="120" class="box" />
  <text x="80" y="135" class="text">User Browser</text>
  <text x="80" y="155" class="text">Direct Line UI</text>
  <text x="80" y="175" class="text">Graph Retrieval UI (MSAL)</text>

  <!-- Django app -->
  <rect x="360" y="90" width="260" height="160" class="box" />
  <text x="380" y="125" class="text">Django Server</text>
  <text x="380" y="145" class="text">directline_frontend.html</text>
  <text x="380" y="165" class="text">graph_frontend.html</text>
  <text x="380" y="185" class="text">directline_token_endpoint.py</text>
  <text x="380" y="205" class="text">graph_retrieval_endpoint.py</text>

  <!-- Azure Bot + Direct Line -->
  <rect x="700" y="100" width="230" height="130" class="cloud" />
  <text x="720" y="135" class="text">Azure Bot Service</text>
  <text x="720" y="155" class="text">Direct Line Channel</text>
  <text x="720" y="175" class="text">Direct Line Secret</text>

  <!-- Copilot Studio Agent -->
  <rect x="1030" y="90" width="300" height="160" class="cloud" />
  <text x="1050" y="125" class="text">Copilot Studio Agent</text>
  <text x="1050" y="145" class="text">Bot logic + dialogs</text>
  <text x="1050" y="165" class="text">OpenAPI connector</text>
  <text x="1050" y="185" class="text">Calls backend/API</text>

  <!-- Microsoft Graph -->
  <rect x="700" y="320" width="230" height="110" class="cloud" />
  <text x="720" y="355" class="text">Microsoft Graph</text>
  <text x="720" y="375" class="text">Copilot Retrieval API</text>

  <!-- Azure Entra ID -->
  <rect x="1030" y="320" width="300" height="110" class="cloud" />
  <text x="1050" y="355" class="text">Microsoft Entra ID</text>
  <text x="1050" y="375" class="text">Auth (MSAL SPA)</text>

  <!-- Local backend note -->
  <rect x="360" y="330" width="260" height="90" class="box" />
  <text x="380" y="360" class="text">Local components</text>
  <text x="380" y="380" class="text">Python + Django</text>

  <!-- Arrows: user to Django -->
  <line x1="300" y1="140" x2="360" y2="140" class="arrow" />
  <line x1="300" y1="180" x2="360" y2="180" class="arrow" />

  <!-- Django to Direct Line token endpoint -->
    <line x1="620" y1="140" x2="700" y2="140" class="arrow" />
    <text x="640" y="80" class="label-red">/api/directline/token</text>

  <!-- Direct Line to Copilot Studio -->
  <line x1="930" y1="140" x2="1030" y2="140" class="arrow" />
    <text x="940" y="85" class="label-red">User messages</text>

    <!-- Copilot Studio back to Direct Line -->
    <line x1="1030" y1="180" x2="930" y2="180" class="arrow" />
    <text x="940" y="205" class="label-red">Replies</text>

  <!-- Graph retrieval path: frontend -> Django -> Graph -->
  <line x1="490" y1="250" x2="490" y2="330" class="arrow" />
  <text x="430" y="295" class="label-red">MSAL token</text>
  <line x1="620" y1="370" x2="700" y2="370" class="arrow" />
  <text x="610" y="392" class="label-red">Bearer to Graph</text>

  <!-- Auth flow -->
  <line x1="490" y1="250" x2="1030" y2="320" class="arrow" />
  <text x="760" y="270" class="label-red">Auth code + PKCE</text>

  <!-- Copilot Studio to OpenAPI backend (local) -->
    <line x1="1180" y1="190" x2="620" y2="350" class="arrow" />
    <text x="900" y="240" class="label-red">OpenAPI connector calls</text>

</svg>
