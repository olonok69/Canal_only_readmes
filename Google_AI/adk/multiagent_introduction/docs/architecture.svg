<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; ry: 10; }
      .title { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .text { font: 14px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .note { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #6b7280; }
      .arrow { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrowGray { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrowheadGray); }
      .chip { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; rx: 6; ry: 6; }
      .chipText { font: 12px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .state { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2; rx: 12; ry: 12; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowheadGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af" />
    </marker>
  </defs>

  <!-- Input FNOL -->
  <rect x="40" y="60" width="200" height="70" class="box" />
  <text x="140" y="95" text-anchor="middle" class="title">FNOL narrative</text>
  <text x="140" y="115" text-anchor="middle" class="note">free‑form text</text>

  <!-- extract_claim_info agent -->
  <rect x="300" y="40" width="240" height="110" class="box" />
  <text x="420" y="70" text-anchor="middle" class="title">extract_claim_info (Agent)</text>
  <rect x="320" y="85" width="200" height="40" class="chip" />
  <text x="420" y="110" text-anchor="middle" class="chipText">Tool: set_claim_info(...)</text>

  <!-- assess_severity agent -->
  <rect x="300" y="200" width="240" height="110" class="box" />
  <text x="420" y="230" text-anchor="middle" class="title">assess_severity (Agent)</text>
  <rect x="320" y="245" width="200" height="40" class="chip" />
  <text x="420" y="270" text-anchor="middle" class="chipText">Tool: set_severity(level, rationale)</text>

  <!-- route_claim agent -->
  <rect x="300" y="360" width="240" height="110" class="box" />
  <text x="420" y="390" text-anchor="middle" class="title">route_claim (Agent)</text>
  <rect x="320" y="405" width="200" height="40" class="chip" />
  <text x="420" y="430" text-anchor="middle" class="chipText">Tool: set_route(queue, rationale)</text>

  <!-- root agent -->
  <rect x="860" y="200" width="210" height="110" class="box" />
  <text x="965" y="230" text-anchor="middle" class="title">root (coordinator)</text>
  <text x="965" y="250" text-anchor="middle" class="text">summary + guidance</text>

  <!-- session state -->
  <rect x="590" y="160" width="240" height="260" class="state" />
  <text x="710" y="190" text-anchor="middle" class="title">session.state</text>
  <rect x="610" y="210" width="200" height="50" class="chip" />
  <text x="710" y="240" text-anchor="middle" class="chipText">claim_info</text>
  <rect x="610" y="270" width="200" height="50" class="chip" />
  <text x="710" y="300" text-anchor="middle" class="chipText">severity</text>
  <rect x="610" y="330" width="200" height="50" class="chip" />
  <text x="710" y="360" text-anchor="middle" class="chipText">route</text>
  <text x="710" y="392" text-anchor="middle" class="note">InMemorySessionService</text>

  <!-- Arrows across stages -->
  <path d="M240,95 L300,95" class="arrow" />
  <path d="M540,95 L590,210" class="arrowGray" />
  <path d="M540,255 L590,265" class="arrowGray" />
  <path d="M540,415 L590,325" class="arrowGray" />

  <!-- From state to next agents (read) -->
  <path d="M830,235 L830,235" class="arrowGray" />
  <path d="M830,255 L860,255" class="arrowGray" />

  <!-- Stage connectors (explicit ordering) -->
  <path d="M420,150 C420,170 420,180 420,200" class="arrow" />
  <path d="M420,310 C420,330 420,340 420,360" class="arrow" />
  <path d="M540,415 C780,415 780,255 860,255" class="arrow" />

  <!-- Notes -->
  <text x="420" y="520" text-anchor="middle" class="note">Deterministic function calling (temperature 0.1)</text>
  <text x="420" y="540" text-anchor="middle" class="note">Pydantic validation inside Tools (quality gates)</text>
  <text x="420" y="560" text-anchor="middle" class="note">Guards + nudges after each stage</text>

  <!-- Legend -->
  <rect x="40" y="560" width="280" height="90" class="box" />
  <text x="60" y="585" class="text">Legend</text>
  <rect x="60" y="600" width="20" height="12" class="box" />
  <text x="90" y="610" class="note">Agent / Component</text>
  <rect x="60" y="620" width="20" height="12" class="state" />
  <text x="90" y="630" class="note">Session state</text>
</svg>
