<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="50%" style="stop-color:#1a0a3e"/>
      <stop offset="100%" style="stop-color:#0a1a2e"/>
    </linearGradient>
    <linearGradient id="neuron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
    <linearGradient id="input_n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bfff"/>
      <stop offset="100%" style="stop-color:#0066cc"/>
    </linearGradient>
    <linearGradient id="output_n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00cc66"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="url(#bg2)"/>

  <!-- Circuit-board pattern -->
  <g opacity="0.05" stroke="#00bfff" stroke-width="1">
    <path d="M0,180 L100,180 L120,160 L200,160"/>
    <path d="M720,100 L620,100 L600,120 L520,120"/>
    <path d="M0,280 L80,280 L100,260 L180,260"/>
    <path d="M720,250 L640,250 L620,270 L540,270"/>
    <circle cx="200" cy="160" r="3" fill="#00bfff"/>
    <circle cx="520" cy="120" r="3" fill="#00bfff"/>
    <circle cx="180" cy="260" r="3" fill="#00bfff"/>
    <circle cx="540" cy="270" r="3" fill="#00bfff"/>
  </g>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold" font-family="sans-serif" filter="url(#shadow2)">
    Deep Q-Network
  </text>
  <text x="360" y="52" text-anchor="middle" fill="#ff6b6b" font-size="12" font-family="sans-serif" opacity="0.8">
    Neural Network Q-Function Approximation
  </text>

  <!-- Neural Network Diagram -->
  <g transform="translate(120, 75)">
    <!-- Connection lines (drawn first, behind neurons) -->
    <!-- Input to Hidden1 -->
    <g stroke="#444" stroke-width="0.8" opacity="0.4">
      <!-- x1 connections -->
      <line x1="30" y1="30" x2="160" y2="20"/>
      <line x1="30" y1="30" x2="160" y2="60"/>
      <line x1="30" y1="30" x2="160" y2="100"/>
      <line x1="30" y1="30" x2="160" y2="140"/>
      <line x1="30" y1="30" x2="160" y2="180"/>
      <line x1="30" y1="30" x2="160" y2="220"/>
      <!-- x2 connections -->
      <line x1="30" y1="90" x2="160" y2="20"/>
      <line x1="30" y1="90" x2="160" y2="60"/>
      <line x1="30" y1="90" x2="160" y2="100"/>
      <line x1="30" y1="90" x2="160" y2="140"/>
      <line x1="30" y1="90" x2="160" y2="180"/>
      <line x1="30" y1="90" x2="160" y2="220"/>
      <!-- x3 connections -->
      <line x1="30" y1="150" x2="160" y2="20"/>
      <line x1="30" y1="150" x2="160" y2="60"/>
      <line x1="30" y1="150" x2="160" y2="100"/>
      <line x1="30" y1="150" x2="160" y2="140"/>
      <line x1="30" y1="150" x2="160" y2="180"/>
      <line x1="30" y1="150" x2="160" y2="220"/>
      <!-- x4 connections -->
      <line x1="30" y1="210" x2="160" y2="20"/>
      <line x1="30" y1="210" x2="160" y2="60"/>
      <line x1="30" y1="210" x2="160" y2="100"/>
      <line x1="30" y1="210" x2="160" y2="140"/>
      <line x1="30" y1="210" x2="160" y2="180"/>
      <line x1="30" y1="210" x2="160" y2="220"/>
    </g>

    <!-- Hidden1 to Hidden2 -->
    <g stroke="#555" stroke-width="0.6" opacity="0.3">
      <line x1="180" y1="20" x2="300" y2="20"/>
      <line x1="180" y1="20" x2="300" y2="60"/>
      <line x1="180" y1="20" x2="300" y2="100"/>
      <line x1="180" y1="20" x2="300" y2="140"/>
      <line x1="180" y1="20" x2="300" y2="180"/>
      <line x1="180" y1="20" x2="300" y2="220"/>
      <line x1="180" y1="100" x2="300" y2="20"/>
      <line x1="180" y1="100" x2="300" y2="60"/>
      <line x1="180" y1="100" x2="300" y2="100"/>
      <line x1="180" y1="100" x2="300" y2="140"/>
      <line x1="180" y1="100" x2="300" y2="180"/>
      <line x1="180" y1="100" x2="300" y2="220"/>
      <line x1="180" y1="180" x2="300" y2="20"/>
      <line x1="180" y1="180" x2="300" y2="60"/>
      <line x1="180" y1="180" x2="300" y2="100"/>
      <line x1="180" y1="180" x2="300" y2="140"/>
      <line x1="180" y1="180" x2="300" y2="180"/>
      <line x1="180" y1="180" x2="300" y2="220"/>
    </g>

    <!-- Hidden2 to Output -->
    <g stroke="#555" stroke-width="0.8" opacity="0.5">
      <line x1="320" y1="20" x2="430" y2="80"/>
      <line x1="320" y1="60" x2="430" y2="80"/>
      <line x1="320" y1="100" x2="430" y2="80"/>
      <line x1="320" y1="140" x2="430" y2="80"/>
      <line x1="320" y1="180" x2="430" y2="80"/>
      <line x1="320" y1="220" x2="430" y2="80"/>
      <line x1="320" y1="20" x2="430" y2="160"/>
      <line x1="320" y1="60" x2="430" y2="160"/>
      <line x1="320" y1="100" x2="430" y2="160"/>
      <line x1="320" y1="140" x2="430" y2="160"/>
      <line x1="320" y1="180" x2="430" y2="160"/>
      <line x1="320" y1="220" x2="430" y2="160"/>
    </g>

    <!-- Input neurons -->
    <g filter="url(#glow2)">
      <circle cx="30" cy="30" r="14" fill="url(#input_n)" opacity="0.9"/>
      <circle cx="30" cy="90" r="14" fill="url(#input_n)" opacity="0.9"/>
      <circle cx="30" cy="150" r="14" fill="url(#input_n)" opacity="0.9"/>
      <circle cx="30" cy="210" r="14" fill="url(#input_n)" opacity="0.9"/>
    </g>
    <text x="30" y="35" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold" font-family="monospace">x₁</text>
    <text x="30" y="95" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold" font-family="monospace">x₂</text>
    <text x="30" y="155" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold" font-family="monospace">x₃</text>
    <text x="30" y="215" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold" font-family="monospace">x₄</text>

    <!-- Hidden layer 1 -->
    <g opacity="0.85">
      <circle cx="170" cy="20" r="12" fill="url(#neuron)"/>
      <circle cx="170" cy="60" r="12" fill="url(#neuron)"/>
      <circle cx="170" cy="100" r="12" fill="url(#neuron)"/>
      <circle cx="170" cy="140" r="12" fill="url(#neuron)"/>
      <circle cx="170" cy="180" r="12" fill="url(#neuron)"/>
      <circle cx="170" cy="220" r="12" fill="url(#neuron)"/>
    </g>

    <!-- Hidden layer 2 -->
    <g opacity="0.85">
      <circle cx="310" cy="20" r="12" fill="url(#neuron)"/>
      <circle cx="310" cy="60" r="12" fill="url(#neuron)"/>
      <circle cx="310" cy="100" r="12" fill="url(#neuron)"/>
      <circle cx="310" cy="140" r="12" fill="url(#neuron)"/>
      <circle cx="310" cy="180" r="12" fill="url(#neuron)"/>
      <circle cx="310" cy="220" r="12" fill="url(#neuron)"/>
    </g>

    <!-- Output neurons -->
    <g filter="url(#glow2)">
      <circle cx="440" cy="80" r="16" fill="url(#output_n)" opacity="0.9"/>
      <circle cx="440" cy="160" r="16" fill="url(#output_n)" opacity="0.9"/>
    </g>
    <text x="440" y="85" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold" font-family="monospace">Q₁</text>
    <text x="440" y="165" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold" font-family="monospace">Q₂</text>

    <!-- Layer labels -->
    <text x="30" y="-8" text-anchor="middle" fill="#00bfff" font-size="9" font-family="sans-serif">State</text>
    <text x="30" y="2" text-anchor="middle" fill="#00bfff" font-size="8" font-family="sans-serif">[4]</text>
    <text x="170" y="-8" text-anchor="middle" fill="#ff6b6b" font-size="9" font-family="sans-serif">Hidden</text>
    <text x="170" y="2" text-anchor="middle" fill="#ff6b6b" font-size="8" font-family="sans-serif">[128]</text>
    <text x="310" y="-8" text-anchor="middle" fill="#ff6b6b" font-size="9" font-family="sans-serif">Hidden</text>
    <text x="310" y="2" text-anchor="middle" fill="#ff6b6b" font-size="8" font-family="sans-serif">[128]</text>
    <text x="440" y="-8" text-anchor="middle" fill="#00ff88" font-size="9" font-family="sans-serif">Q-Values</text>
    <text x="440" y="2" text-anchor="middle" fill="#00ff88" font-size="8" font-family="sans-serif">[2]</text>

    <!-- "⋮" indicators for hidden layers -->
    <text x="170" y="250" text-anchor="middle" fill="#888" font-size="10">×128</text>
    <text x="310" y="250" text-anchor="middle" fill="#888" font-size="10">×128</text>

    <!-- Action labels with highlight -->
    <text x="478" y="76" fill="#aaa" font-size="9" font-family="monospace">← Left</text>
    <text x="478" y="156" fill="#00ff88" font-size="9" font-family="monospace" font-weight="bold">→ Right ✓</text>
  </g>

  <!-- Key components boxes at bottom -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="150" height="30" rx="5" fill="#1a0a3e" stroke="#ff6b6b" stroke-width="1" opacity="0.8"/>
    <text x="75" y="19" text-anchor="middle" fill="#ff6b6b" font-size="10" font-family="sans-serif">🧠 Neural Network</text>

    <rect x="170" y="0" width="150" height="30" rx="5" fill="#1a0a3e" stroke="#ffd700" stroke-width="1" opacity="0.8"/>
    <text x="245" y="19" text-anchor="middle" fill="#ffd700" font-size="10" font-family="sans-serif">📦 Replay Buffer</text>

    <rect x="340" y="0" width="150" height="30" rx="5" fill="#1a0a3e" stroke="#00bfff" stroke-width="1" opacity="0.8"/>
    <text x="415" y="19" text-anchor="middle" fill="#00bfff" font-size="10" font-family="sans-serif">🎯 Target Network</text>

    <rect x="510" y="0" width="160" height="30" rx="5" fill="#1a0a3e" stroke="#00ff88" stroke-width="1" opacity="0.8"/>
    <text x="590" y="19" text-anchor="middle" fill="#00ff88" font-size="10" font-family="sans-serif">📉 MSE Loss</text>
  </g>

  <!-- Bellman equation -->
  <text x="360" y="380" text-anchor="middle" fill="#aaa" font-size="11" font-family="serif" font-style="italic">
    L(θ) = E[ (Q_θ(s,a) − [r + γ max Q_θ⁻(s',a')])² ]
  </text>
</svg>
